<!doctype html>

<html lang="{{ site.lang | default: 'it-IT' }}">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#f4f1ea"
    >

    {% seo %}

    <link
        rel="stylesheet"
        href="{{ '/assets/css/main.css' | relative_url }}"
    >

</head>

<body>

    {% include header.html %}

    <main id="main-content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script
        src="{{ '/assets/js/main.js' | relative_url }}"
        defer
    ></script>

</body>

</html>
