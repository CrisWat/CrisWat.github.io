<!doctype html>

<html lang="{{ site.lang | default: 'it-IT' }}">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF6EF">

    <script>document.documentElement.className += " js";</script>

    {% seo %}

    <!-- icone: Google usa quelle con lato multiplo di 48 px (48, 96, 192) -->
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
    <link rel="icon" href="{{ '/assets/images/favicon-192.png' | relative_url }}" sizes="192x192" type="image/png">
    <link rel="icon" href="{{ '/assets/images/favicon-96.png' | relative_url }}" sizes="96x96" type="image/png">
    <link rel="icon" href="{{ '/assets/images/favicon-48.png' | relative_url }}" sizes="48x48" type="image/png">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    {% if page.url == '/' %}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Cristiano Fanelli",
        "jobTitle": "Astrofisico e ricercatore",
        "worksFor": { "@type": "Organization", "name": "INAF — Istituto Nazionale di Astrofisica" },
        "address": { "@type": "PostalAddress", "addressLocality": "Bologna", "addressCountry": "IT" },
        "url": "{{ site.url }}",
        "image": "{{ site.url }}/assets/images/ritratto-cristiano-fanelli.jpg",
        "sameAs": [
            "{{ site.data.profiles.linkedin }}",
            "{{ site.data.profiles.instagram }}",
            "{{ site.data.profiles.unibo }}",
            "{{ site.data.profiles.inaf }}",
            "{{ site.data.profiles.github }}"
        ]
    }
    </script>
    {% endif %}

</head>

<body>

    <a class="skip-link" href="#main-content">Salta al contenuto</a>

    {% include header.html %}

    <main id="main-content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</body>

</html>
