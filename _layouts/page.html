---
layout: default
---

<section class="page-hero">
    <div class="container page-hero-inner">

        {% if page.eyebrow %}
            <p class="eyebrow">
                {{ page.eyebrow }}
            </p>
        {% endif %}

        <h1>{{ page.title }}</h1>

        {% if page.description %}
            <p class="page-intro">
                {{ page.description }}
            </p>
        {% endif %}

    </div>
</section>

<section class="page-content">
    <div class="container content-narrow">
        {{ content }}
    </div>
</section>
