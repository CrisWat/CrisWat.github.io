---
layout: default
---

<section class="page-hero">
    {% include sky.html %}
    <div class="container page-hero-inner {% if page.content_width == 'wide' %}content-wide{% elsif page.content_width == 'full' %}content-full{% else %}content-narrow{% endif %}">

        {% if page.eyebrow %}
            <p class="eyebrow">{{ page.eyebrow }}</p>
        {% endif %}

        <h1>{{ page.heading | default: page.title }}</h1>

        {% if page.intro or page.description %}
            <p class="page-intro">{{ page.intro | default: page.description }}</p>
        {% endif %}

    </div>
</section>

<section class="page-content">
    <div class="container {% if page.content_width == 'wide' %}content-wide{% elsif page.content_width == 'full' %}content-full{% else %}content-narrow{% endif %}">
        {{ content }}
    </div>
</section>
