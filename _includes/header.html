<header id="site-header" class="site-header">
    <nav class="nav container" aria-label="Navigazione principale">

        <a class="logo" href="{{ '/' | relative_url }}">
            <span class="logo-mark">CF</span>
            <span class="logo-coord">44°29′N · 11°20′E</span>
        </a>

        <button
            class="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-navigation"
            aria-label="Apri il menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul id="site-navigation" class="nav-links">
            {% for item in site.data.navigation %}
                <li>
                    <a
                        href="{{ item.url | relative_url }}"
                        {% if page.url == item.url %}aria-current="page"{% endif %}
                    >
                        {{ item.title }}
                    </a>
                </li>
            {% endfor %}
        </ul>

    </nav>
</header>
