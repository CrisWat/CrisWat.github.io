<header id="site-header" class="site-header">
    <nav class="nav container" aria-label="Navigazione principale">

        <a class="logo" href="{{ '/' | relative_url }}">
            <span class="logo-name">Cristiano Fanelli</span>
            <span class="logo-role">Astrofisico · Bologna</span>
        </a>

        <button
            class="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-navigation"
        >
            <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="menu-label">Menu</span>
        </button>

        <ul id="site-navigation" class="nav-links">
            {% for item in site.data.navigation %}
                <li{% if item.cta %} class="nav-cta"{% endif %}>
                    <a
                        href="{{ item.url | relative_url }}"
                        {% if page.url == item.url or page.section == item.url %}aria-current="page"{% endif %}
                    >{{ item.title }}</a>
                </li>
            {% endfor %}
        </ul>

    </nav>
</header>
