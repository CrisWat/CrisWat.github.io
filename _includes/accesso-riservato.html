{% comment %}
    Modulo per le aree riservate con password.
    Uso:  include accesso-riservato.html modo="pagina"      contenuto dentro la pagina
          include accesso-riservato.html modo="documento"   strumento a pagina intera
    Il contenuto cifrato va in <script type="application/json" id="contenuto-cifrato">.
    Le pagine che lo usano sono generate da _materiali/didattica/cifra.py.
{% endcomment %}
<div id="accesso-riservato" class="accesso-riservato" data-modo="{{ include.modo | default: 'pagina' }}">
    <form id="accesso-form" class="accesso-form" hidden>
        <p class="accesso-icona" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        </p>
        <h2>Area riservata agli studenti</h2>
        <p>{{ include.testo | default: "Questa sezione contiene i materiali del corso. Inserisci la password che ti è stata comunicata a lezione." }}</p>
        <label for="accesso-password">Password</label>
        <div class="accesso-riga">
            <input id="accesso-password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
            <button class="button button-primary" type="submit">Entra <span class="arrow" aria-hidden="true">→</span></button>
        </div>
        <p id="accesso-messaggio" class="accesso-messaggio" role="status" aria-live="polite"></p>
    </form>
    <noscript><p class="accesso-messaggio errore">Per aprire quest'area serve JavaScript attivo nel browser.</p></noscript>
</div>
<script src="{{ '/assets/js/accesso-riservato.js' | relative_url }}" defer></script>
