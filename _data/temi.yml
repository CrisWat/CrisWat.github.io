- id: "ia"
  title: "IA governata"
  card: "Perché un cittadino deve perdere ore per trovare una visita specialistica? L'intelligenza artificiale pubblica può semplificare la vita, se è trasparente e sotto controllo umano."
  lead: "L'intelligenza artificiale va governata, non subita."
  problem: >-
    L'intelligenza artificiale entra già in sanità, scuola, lavoro e uffici pubblici. Può far
    risparmiare tempo e risorse, ma deve essere al servizio delle persone, non il contrario.
    Intanto un cittadino perde ancora ore a cercare una visita specialistica.
  proposals:
    - "Sistemi pubblici intelligenti che semplifichino la vita quotidiana. Per esempio, una prenotazione sanitaria che trovi subito le disponibilità, recuperi gli appuntamenti cancellati e ottimizzi le agende, rispettando sempre le priorità cliniche."
    - "Ogni algoritmo usato dalla Pubblica Amministrazione deve essere trasparente, verificabile e soggetto al controllo umano, senza rinunciare ai diritti, alla privacy e alla responsabilità delle decisioni."
  why: "Costruisco reti neurali ogni giorno all'INAF e ho contribuito a scrivere il documento finale di IDIA sull'intelligenza artificiale. Conosco le potenzialità dell'IA e so dove sbaglia: deve aiutare le persone, non sostituirsi a loro."
  why_link: "/ricerca/"

- id: "tecnologie"
  title: "Tecnologie emergenti"
  card: "Spazio, supercalcolo e intelligenza artificiale sono strategici per il futuro e per la nostra autonomia. Il valore che producono deve diventare un beneficio collettivo."
  lead: "Non basta sviluppare nuove tecnologie: il valore che producono deve diventare un beneficio collettivo."
  problem: >-
    Spazio, supercalcolo, intelligenza artificiale, semiconduttori, cloud e dati pubblici sono
    tecnologie strategiche, non solo per l'economia ma per l'autonomia tecnologica del Paese.
    Eppure l'accesso alle infrastrutture più avanzate resta spesso riservato a pochi grandi
    soggetti.
  proposals:
    - "Un programma nazionale di accesso condiviso alle infrastrutture tecnologiche: università, centri di ricerca, startup, piccole imprese e amministrazioni devono poter usare supercalcolo, cloud sicuro e dati pubblici interoperabili, con procedure semplici e trasparenti."
    - "Unire dati satellitari e supercalcolo per monitorare il territorio e prevenire il rischio idrogeologico."
  why: "Da ricercatore so quanto conti avere accesso a infrastrutture avanzate. Ho lavorato al CINECA sul supercalcolo e ho co-fondato una startup spaziale a Bologna."
  why_link: "/progetti/"

- id: "clima"
  title: "Clima e ambiente"
  card: "La crisi climatica è una questione di giustizia sociale e generazionale: rischia di colpire di più chi ha contribuito di meno."
  lead: "Difendere l'ambiente significa impedire che il benessere di pochi, oggi, venga pagato con il futuro di molti, domani."
  problem: >-
    La crisi climatica è una delle più grandi questioni di giustizia sociale e generazionale
    del nostro tempo. Rischia di amplificare le disuguaglianze: chi ha contribuito meno al
    problema, di solito le fasce più povere, ne pagherà il prezzo più alto, mentre chi ha
    inquinato di più ha più risorse per proteggersi. Non può più essere trattata come una
    questione secondaria, separata dall'economia e dalle politiche sociali.
  proposals:
    - "Usare i dati satellitari per monitorare il territorio, prevenire i rischi ambientali e orientare gli investimenti pubblici."
    - "Tenere insieme transizione ecologica, redistribuzione delle risorse e tutela delle persone più vulnerabili: la tecnologia, da sola, non basta."
    - "Educazione ambientale nelle scuole, perché stiamo parlando soprattutto del futuro dei ragazzi."
  why: "Come ricercatore lavoro con analisi dei dati, modelli scientifici e intelligenza artificiale, e mi sono occupato di sostenibilità delle attività spaziali. Faccio divulgazione ambientale nelle scuole medie e superiori."
  why_link: "/didattica/"

- id: "ricerca"
  title: "Scuola, università e ricerca"
  card: "Non voglio un Paese in cui il futuro di un ragazzo dipenda dal conto in banca dei suoi genitori. Scuola, università e ricerca pubbliche devono rimettere in moto l'ascensore sociale."
  lead: "La conoscenza non è una voce di spesa: è un investimento sulla stabilità, sulla sicurezza e sulla prosperità del Paese."
  problem: >-
    Se per affermarti devi sopportare anni di precarietà, trasferimenti e instabilità
    economica, chi non ha una famiglia in grado di sostenerlo parte svantaggiato. L'ascensore
    sociale si ferma e il merito rischia di diventare un privilegio di chi può permettersi di
    aspettare. Intanto formiamo talenti e li costringiamo a cercare altrove le condizioni per
    lavorare.
  proposals:
    - "Un piano nazionale pluriennale di reclutamento e finanziamento della ricerca pubblica: investimenti strutturali, concorsi regolari e trasparenti, percorsi professionali prevedibili per i giovani ricercatori."
    - "Investire nell'istruzione pubblica, dalla scuola all'università, perché le opportunità non dipendano dalle condizioni di partenza."
  why: "All'università mi sono mantenuto lavorando la sera come barista. Conosco il precariato della ricerca perché lo vivo: dopo il dottorato e due anni da assegnista, oggi sono ricercatore a tempo determinato. Sono stato rappresentante di studenti e dottorandi in Dipartimento e sono iscritto all'ADI."
  why_link: "/chi-sono/"

- id: "giovani"
  title: "Giovani e presente"
  card: "I giovani non sono solo il futuro: sono il presente. Lavoro stabile, salari dignitosi e servizi che funzionano devono permettere di costruire qui la propria vita."
  lead: "Restare in Italia non deve essere un atto di coraggio."
  problem: >-
    Ogni giorno tanti giovani partono non per avventura, ma per necessità: salari troppo bassi,
    contratti precari, un costo della vita che toglie ogni prospettiva di autonomia. Quando se ne
    vanno, i territori si svuotano: chiudono negozi, si riducono i servizi, le scuole faticano a
    formare le classi. E se tanti rinunciano ad avere figli non è per mancanza di voglia, ma
    perché non possono progettare il proprio futuro.
  proposals:
    - "Contrastare la precarietà in tutta la società, non solo nell'università: contratti stabili e salari dignitosi, a partire da chi lavora nei servizi, nella cultura e nell'assistenza."
    - "Valorizzare chi lavora negli ospedali, nelle scuole e nella pubblica amministrazione, perché medici, infermieri e insegnanti non siano costretti a partire o a cambiare mestiere."
    - "Congedi adeguati e servizi per l'infanzia che funzionino, perché formare una famiglia non sia un rischio economico."
    - "Non lasciare indietro le aree interne e i piccoli comuni: servizi, trasporti e scuole per chi sceglie di restare."
  why: "Sono stato il primo referente giovani del mio gruppo territoriale a Bologna e oggi coordino una task force del Network Giovani. Nell'articolo «La sicurezza tradita» ho scritto perché una nazione che perde i suoi giovani non è una nazione sicura."
  why_link: "/blog/2026/10/08/la-sicurezza-tradita/"

- id: "sicurezza"
  title: "Sicurezza"
  card: "La sicurezza è prevenzione, legalità e presenza dello Stato: città in cui nessuno debba avere paura, senza sacrificare diritti, libertà e coesione sociale."
  lead: "Essere dalla parte di chi chiede sicurezza significa anche essere dalla parte di chi chiede dignità, inclusione e opportunità."
  problem: >-
    La sicurezza è un diritto: camminare per strada senza paura, tornare a casa la sera
    tranquilli, vivere il proprio quartiere. A Bologna penso alla zona della stazione e alla
    Bolognina, dove convivono problemi di sicurezza, fragilità sociali e una comunità che ha
    diritto di vivere serenamente i propri spazi. Non bastano interventi straordinari: serve un
    lavoro quotidiano, senza confondere la povertà con la delinquenza.
  proposals:
    - "Rafforzare la sicurezza integrata con presìdi stabili di prossimità, coordinando forze dell'ordine, Polizia locale, servizi sociali, scuole e associazioni: più presenza in strada, illuminazione, recupero degli spazi abbandonati, interventi sulle dipendenze."
    - "Forze dell'ordine con personale, risorse e strumenti adeguati."
    - "Sport accessibile a tutti: sostegno alle associazioni sportive dilettantistiche, palestre scolastiche aperte oltre l'orario delle lezioni, programmi gratuiti o a costo ridotto nei quartieri più fragili."
    - "Obiettivi misurabili e risultati pubblici, perché i cittadini possano verificare se le politiche funzionano davvero."
  why: "Credo che uno Stato forte sia quello che sa prevenire, proteggere e non abbandonare i propri cittadini. Da volontario con Special Olympics ho visto quanto lo sport sappia includere e far crescere: la sicurezza di una comunità si costruisce anche dando ai giovani un posto in cui crescere."
  why_link: "/impegno-pubblico/"
