# Aree di ricerca — modifica/aggiungi voci qui.
- title: "Spettroscopia stellare"
  plain: "Leggere la luce delle stelle per ricostruire la storia della nostra Galassia."
  summary: >-
    Caratterizzazione fisica e chimica delle popolazioni stellari con spettroscopia ad alta
    risoluzione: abbondanze chimiche, temperatura, gravità e moto di stelle giganti fredde e
    calde, osservate con grandi telescopi in Italia e all'estero.

- title: "Intelligenza artificiale per lo studio delle stelle"
  plain: "Insegnare a una rete neurale a leggere gli spettri, per analizzare in modo automatico i dati delle grandi survey."
  summary: >-
    Reti neurali e machine learning per ricavare in modo automatico parametri stellari e
    abbondanze chimiche dagli spettri, in vista delle grandi survey dei prossimi anni (MOONS
    al Very Large Telescope, ANDES all'Extremely Large Telescope).

- title: "Metodi statistici e analisi dei dati"
  plain: "Misure affidabili, incertezze dichiarate, risultati verificabili."
  summary: >-
    Metodi statistici e computazionali (anche bayesiani) per inferenza e analisi di grandi
    insiemi di dati, con standard di qualità per misure accurate e pipeline automatiche.

- title: "Osservazione dello spazio vicino alla Terra"
  plain: "Sapere cosa gira in orbita per evitare collisioni tra satelliti e detriti."
  summary: >-
    Metodi quantitativi e IA per riconoscere satelliti e detriti in orbita bassa e media da
    osservazioni ottiche e ricavarne le orbite, a supporto della sorveglianza dello spazio
    (Space Surveillance and Tracking).
