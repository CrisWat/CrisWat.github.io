# =====================================================================
# Strumenti interattivi della pagina /strumenti/.
# Per aggiungere un nuovo strumento: metti il file HTML nella cartella
# strumenti/ (con il suo front matter e permalink) e aggiungi qui una voce.
# =====================================================================

- title: "Prova tu la riforma dell'IRPEF"
  url: "/strumenti/riforma-irpef/"
  category: "Tasse e redditi"
  status: "Simulatore"
  tagline: "Chi pagherebbe di più, chi di meno, quanto incasserebbe lo Stato."
  description: "Cambia le regole dell'imposta sui redditi (scaglioni, flat tax o aliquota che sale piano piano) e guarda subito l'effetto sulle tasse delle persone e sul gettito. I calcoli usano i redditi dichiarati nel 2024 da quasi 41 milioni di persone."

- title: "Quanti anni ti servono per una casa?"
  url: "/strumenti/stipendio-casa/"
  category: "Giovani e casa"
  status: "Calcolatore"
  tagline: "Il peso dell'affitto, gli anni per comprare e il confronto con il 1995."
  description: "Inserisci stipendio e città e scopri quanto pesa l'affitto, quanti anni servono per l'anticipo e quanto costerebbe il mutuo. Poi il confronto con un giovane del 1995 e la classifica dei 109 capoluoghi di provincia, con i dati ufficiali dell'Agenzia delle Entrate."

- title: "Ti fidi della macchina?"
  url: "/strumenti/fiducia-ia/"
  category: "Intelligenza artificiale"
  status: "Test · 3 minuti"
  tagline: "Quanto ti fidi di un consiglio, se a dartelo è un'IA?"
  description: "Un piccolo esperimento in dieci domande: rispondi da solo, ricevi un consiglio da un'intelligenza artificiale o da un esperto e decidi se cambiare idea. Alla fine scopri quanto ti sei fidato, e di chi, e cos'è l'AI authority bias."

- title: "Tieni in piedi le pensioni"
  url: "/strumenti/pensioni-del-futuro/"
  category: "Pensioni e futuro"
  status: "Simulatore"
  tagline: "Cosa serve per pagare le pensioni di domani, e quanto prenderà un ragazzo di oggi."
  description: "Scegli quante donne e quanti giovani lavorano, quanti bambini nascono, chi arriva e chi parte, e le regole sull'età della pensione. Guarda come cambia la spesa fino al 2070, con le previsioni ufficiali della Ragioneria Generale dello Stato."

- title: "Porta tu la ricerca al 3%"
  url: "/strumenti/ricerca-al-3-per-cento/"
  category: "Ricerca e università"
  status: "Gioco"
  tagline: "Fai tu il Governo: decidi come spendere per la ricerca e trova i soldi per pagare."
  description: "Oggi l'Italia dà alla ricerca 1,40 euro ogni 100 di ricchezza prodotta, l'Europa punta a 3. Scegli dove investire, dalle università ai giovani ricercatori, e trova le coperture come in una vera legge di bilancio."

- title: "Marta e Marco"
  url: "/strumenti/marta-e-marco/"
  category: "Lavoro e parità"
  status: "Gioco"
  tagline: "Stessa laurea, stesso lavoro, stesso stipendio. Cosa succede nei 40 anni dopo?"
  description: "Scegli cosa accade nella vita di Marta e Marco, dai figli al part-time, e guarda come si allontanano i loro stipendi. Un gioco sul divario di stipendio tra donne e uomini, con i dati INPS."

- title: "Atlante orbitale"
  url: "/strumenti/atlante-orbitale/"
  category: "Spazio"
  status: "Atlante 3D"
  tagline: "Tutto quello che gira attorno alla Terra, su un globo da esplorare."
  description: "Oltre 31.000 oggetti catalogati: satelliti, stazioni spaziali, stadi di razzi e detriti. Confronta le orbite, esplora le nubi di frammenti e simula la sindrome di Kessler, con i dati ufficiali di Space-Track e CelesTrak."

- title: "Un giorno senza satelliti"
  url: "/strumenti/giorno-senza-satelliti/"
  category: "Spazio"
  status: "Racconto · 5 minuti"
  tagline: "Dalla sveglia alla sera: cosa continua, cosa peggiora e cosa si ferma."
  description: "Immagina che per 24 ore tutti i satelliti smettano di funzionare. Segui una giornata qualunque, dalla sveglia al navigatore, dal 112 alla TV, e scopri quanto dipendiamo da loro senza accorgercene. Ogni affermazione ha la sua fonte."

- title: "Il tuo comune nel 2050"
  url: "/strumenti/comune-2050/"
  category: "Clima"
  status: "Mappa e dati · tutti i comuni"
  tagline: "Quanto si è già scaldata la tua zona, e quanto caldo farà nel 2050."
  description: "Scrivi il nome del tuo comune: le strisce del riscaldamento dal 1950 a oggi, e giornate oltre i 30 °C, notti tropicali e temperatura media nel 2050 in tre scenari di emissioni. Dati ERA5 e proiezioni climatiche CMIP6 della Banca Mondiale, per i 7.896 comuni italiani."
