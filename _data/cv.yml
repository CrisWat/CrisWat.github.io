tagline: "Intelligenza artificiale · Spazio · Astrofisica"

profile: >-
  Astrofisico con dottorato di ricerca, ricercatore all'INAF di Bologna, specializzato in
  intelligenza artificiale e machine learning per l'analisi di segnali e spettri, con esperienza
  in modellazione dei dati e reti neurali. Si occupa di sicurezza e geopolitica dello spazio: algoritmi di IA per
  riconoscere satelliti e detriti in orbita, analisi su economia dello spazio, sicurezza delle
  infrastrutture e gestione del traffico spaziale. Ha portato metodi nati in astrofisica in altri
  campi, anche come co-fondatore e amministratore delegato di una startup deep-tech nella gestione
  del traffico spaziale. Ha coordinato il tavolo su sviluppo, ricerca e investimenti per un
  documento di proposte sull'intelligenza artificiale.

