# --- Attività di ricerca ---------------------------------------------
research:
  - area: "Astrofisica stellare & spettroscopia"
    points:
      - "Studio fisico, chimico e cinematico delle popolazioni stellari galattiche."
      - "Analisi di spettri ottici e infrarossi a media e alta risoluzione ottenuti con spettrografi a echelle."
      - "Derivazione di abbondanze chimiche e parametri stellari/cinematici (temperatura efficace, gravità, velocità radiale, micro/macro-turbolenza, rotazione) per stelle giganti fredde e calde."
      - "Sviluppo di software in Python e Fortran per spettri sintetici (trasporto radiativo), modelli atmosferici e riduzione/analisi degli spettri."
      - "Preparazione di proposte osservative con selezione delle configurazioni ottimali dello spettrografo."
  - area: "Space Intelligence (SpaceINT)"
    points:
      - "Sicurezza dell'industria spaziale: satelliti, veicoli di lancio e piattaforme orbitali."
      - "Analisi di satelliti e detriti in LEO/MEO tramite osservazioni ottiche e data processing, con derivazione di parametri orbitali."
      - "Sviluppo di software e codici IA per il riconoscimento automatico di satelliti e detriti spaziali."
      - "Produzione di dati e prodotti informativi per Space Situational Awareness (SSA) e Space Surveillance & Tracking (SST)."
      - "Analisi del trasferimento tecnologico nell'industria spaziale (SST/SSA) tra Italia, Francia, Cina e India."

